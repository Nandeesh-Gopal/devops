<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        input { padding: 10px; margin: 5px; width: 100px; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>

<h1>Calculator</h1>
<h2>Enter two numbers and select an operation:</h2>
<input type="number" id="a" placeholder="Number 1">
<input type="number" id="b" placeholder="Number 2">

<br>

<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>

<h2 id="result"></h2>

<script>
function calc(op) {
    let a = document.getElementById("a").value;
    let b = document.getElementById("b").value;

    fetch(`/calc?a=${a}&b=${b}&op=${op}`)
        .then(res => res.text())
        .then(data => {
            document.getElementById("result").innerText = "Result: " + data;
        });
}
</script>

</body>
</html>
